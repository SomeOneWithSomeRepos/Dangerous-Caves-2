name: Java CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    if: "! contains(toJSON(github.event.commits.*.message), '[SKIP-CI]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven

      - name: Build with Maven
        run: mvn -B verify --file pom.xml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dangerous-Caves-${{ github.sha }}
          path: |
            DangerousCaves/target/Dangerous-Caves-*.jar
            DangerousCaves/target/classes/config.yml
          if-no-files-found: error

      - name: Release on merge to default branch
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}-${{ github.run_number }}
          name: Dangerous Caves build ${{ github.run_number }}
          body: |
            Automated release from master at commit ${{ github.sha }}.
            Compatible with Paper 26.2 and 26.3.
          files: |
            DangerousCaves/target/Dangerous-Caves-*.jar
          generate_release_notes: true
